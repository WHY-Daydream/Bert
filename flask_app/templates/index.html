<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意图分类 - BERT 智能助手</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e0e0e0;
        }

        /* ===== 头部 ===== */
        header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a18cd1, #fbc2eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        header p {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #999;
        }

        /* ===== 主卡片 ===== */
        .container {
            width: 100%;
            max-width: 720px;
            padding: 0 20px 40px;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            padding: 32px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.3s;
        }

        /* ===== 输入区域 ===== */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.07);
            color: #f0f0f0;
            font-size: 1rem;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .input-group input::placeholder { color: #777; }
        .input-group input:focus {
            border-color: #a18cd1;
            box-shadow: 0 0 0 3px rgba(161, 140, 209, 0.25);
        }
        .input-group button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #a18cd1, #6d5bb5);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(161, 140, 209, 0.4);
        }
        .input-group button:active {
            transform: translateY(0);
        }
        .input-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== 示例快捷按钮 ===== */
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0 8px;
        }
        .examples span {
            font-size: 0.85rem;
            color: #888;
            line-height: 32px;
        }
        .examples .chip {
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.05);
            color: #bbb;
            font-size: 0.82rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .examples .chip:hover {
            background: rgba(161, 140, 209, 0.15);
            border-color: #a18cd1;
            color: #ddd;
        }

        /* ===== 状态信息 ===== */
        .status {
            margin-top: 10px;
            font-size: 0.88rem;
            min-height: 1.5em;
            color: #aaa;
        }
        .status.error { color: #f87171; }
        .status.loading { color: #a18cd1; }

        /* ===== 结果卡片 ===== */
        .result {
            margin-top: 24px;
            padding: 24px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .result.show { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .result .label-row .intent-badge {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0f0f0;
        }
        .result .label-row .intent-badge .confidence {
            font-size: 1rem;
            font-weight: 400;
            color: #81c784;
            margin-left: 8px;
        }
        .result .label-row .tag {
            padding: 4px 16px;
            border-radius: 20px;
            background: linear-gradient(135deg, #a18cd1, #6d5bb5);
            font-size: 0.78rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .result .query-text {
            margin-top: 10px;
            font-size: 0.92rem;
            color: #aaa;
            word-break: break-word;
        }
        .result .query-text strong { color: #ccc; }

        /* ===== Top-3 列表 ===== */
        .top3 {
            margin-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
        }
        .top3 .title {
            font-size: 0.82rem;
            color: #888;
            margin-bottom: 8px;
        }
        .top3-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }
        .top3-item:hover { background: rgba(255, 255, 255, 0.04); }
        .top3-item .rank {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .top3-item .rank.r1 { background: rgba(255, 215, 0, 0.18); color: #ffd700; }
        .top3-item .rank.r2 { background: rgba(192, 192, 192, 0.15); color: #c0c0c0; }
        .top3-item .rank.r3 { background: rgba(205, 127, 50, 0.15); color: #cd7f32; }
        .top3-item .label { flex: 1; margin-left: 12px; font-size: 0.92rem; color: #ddd; }
        .top3-item .bar-wrap {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            flex-shrink: 0;
        }
        .top3-item .bar-wrap .bar {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #a18cd1, #fbc2eb);
            transition: width 0.5s ease;
        }
        .top3-item .pct {
            width: 48px;
            text-align: right;
            font-size: 0.82rem;
            color: #aaa;
            flex-shrink: 0;
        }

        /* ===== 底部 ===== */
        footer {
            padding: 20px;
            font-size: 0.78rem;
            color: #555;
            text-align: center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            header h1 { font-size: 1.6rem; }
            .card { padding: 20px 16px; }
            .input-group { flex-direction: column; }
            .input-group button { width: 100%; }
            .result .label-row { flex-direction: column; align-items: flex-start; }
            .top3-item .bar-wrap { width: 80px; }
        }
    </style>
</head>
<body>

<header>
    <h1>✦ 意图识别</h1>
    <p>基于 Chinese-MacBERT-Base 的智能文本分类引擎</p>
</header>

<div class="container">
    <div class="card">

        <!-- 输入 -->
        <div class="input-group">
            <input type="text" id="textInput"
                   placeholder="请输入一句话，例如：这个手机多少钱" autofocus>
            <button id="predictBtn" onclick="doPredict()">识别意图</button>
        </div>

        <!-- 快捷示例 -->
        <div class="examples">
            <span>试试：</span>
            <span class="chip" onclick="fillExample('这个手机多少钱')">📱 价格查询</span>
            <span class="chip" onclick="fillExample('我要退货')">📦 退货</span>
            <span class="chip" onclick="fillExample('我的快递到哪了')">🚚 查快递</span>
            <span class="chip" onclick="fillExample('能开发票吗')">🧾 发票</span>
            <span class="chip" onclick="fillExample('推荐一款笔记本电脑')">💻 求推荐</span>
            <span class="chip" onclick="fillExample('有优惠券吗')">🎫 优惠</span>
        </div>

        <!-- 状态 -->
        <div class="status" id="status">&nbsp;</div>

        <!-- 结果 -->
        <div class="result" id="result">
            <div class="label-row">
                <div>
                    <span class="intent-badge" id="predLabel">—</span>
                    <span class="confidence" id="predConf">(—)</span>
                </div>
                <span class="tag">BERT 分类</span>
            </div>
            <div class="query-text">
                <strong>输入：</strong><span id="queryText"></span>
            </div>
            <div class="top3">
                <div class="title">📊 Top-3 候选</div>
                <div id="top3List"></div>
            </div>
        </div>

    </div>
</div>

<footer>Chinese-MacBERT-Base · 意图识别服务 v1.0</footer>

<script>
    /* ===== 按回车 ===== */
    document.getElementById('textInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doPredict();
    });

    /* ===== 填充示例 ===== */
    function fillExample(text) {
        document.getElementById('textInput').value = text;
        doPredict();
    }

    /* ===== 预测 ===== */
    async function doPredict() {
        const input = document.getElementById('textInput');
        const btn   = document.getElementById('predictBtn');
        const status = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        const text = input.value.trim();
        if (!text) {
            status.textContent = '⚠️ 请输入一段文本';
            status.className = 'status error';
            return;
        }

        // 加载状态
        btn.disabled = true;
        btn.textContent = '识别中...';
        status.textContent = '⏳ 正在分析意图…';
        status.className = 'status loading';
        resultDiv.classList.remove('show');

        try {
            const resp = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });
            const data = await resp.json();

            if (resp.ok) {
                // 显示结果
                document.getElementById('predLabel').textContent = data.prediction;
                document.getElementById('predConf').textContent =
                    `(置信度: ${(data.confidence * 100).toFixed(2)}%)`;
                document.getElementById('queryText').textContent = data.text;

                // Top-3
                const medals = ['🥇', '🥈', '🥉'];
                const ranks = ['r1', 'r2', 'r3'];
                const maxScore = data.top3[0].score || 1;
                const html = data.top3.map((item, i) => `
                    <div class="top3-item">
                        <div class="rank ${ranks[i]}">${i + 1}</div>
                        <span class="label">${item.label}</span>
                        <div class="bar-wrap">
                            <div class="bar" style="width: ${(item.score / maxScore) * 100}%"></div>
                        </div>
                        <span class="pct">${(item.score * 100).toFixed(1)}%</span>
                    </div>
                `).join('');
                document.getElementById('top3List').innerHTML = html;

                resultDiv.classList.add('show');
                status.textContent = '';
                status.className = 'status';
            } else {
                status.textContent = '❌ ' + (data.error || '请求失败');
                status.className = 'status error';
            }
        } catch (err) {
            status.textContent = '❌ 网络错误，请检查服务是否运行';
            status.className = 'status error';
        }

        btn.disabled = false;
        btn.textContent = '识别意图';
    }
</script>

</body>
</html>
